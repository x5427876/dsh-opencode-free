name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          runtime: node@22.19.0
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm pack --dry-run
